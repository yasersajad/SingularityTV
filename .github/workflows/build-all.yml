name: SingularityTV 1.1.6 — Build All Platforms

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: singularitytv-build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (IPA & TIPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Locate source root
        id: src
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "Singularity.xcodeproj" ]]; then
            echo "root=$PWD" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          zip_path="$(find . -maxdepth 2 -type f -name "*.zip" -not -path "./.git/*" | head -n 1 || true)"
          if [[ -z "$zip_path" ]]; then
            echo "::error::No Singularity.xcodeproj or source ZIP found."
            exit 1
          fi
          extract_dir="$RUNNER_TEMP/src"
          rm -rf "$extract_dir" && mkdir -p "$extract_dir"
          unzip -q -o "$zip_path" -d "$extract_dir"
          proj="$(find "$extract_dir" -maxdepth 4 -type d -name "*.xcodeproj" | head -n 1)"
          echo "root=$(dirname "$proj")" >> "$GITHUB_OUTPUT"

      - name: Build Release Archive
        working-directory: ${{ steps.src.outputs.root }}
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "Singularity.xcodeproj" \
            -scheme "Singularity" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SingularityTV.xcarchive" \
            PRODUCT_NAME=SingularityTV \
            PRODUCT_BUNDLE_IDENTIFIER=com.singularity.tv \
            MARKETING_VERSION=1.1.6 \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Install ldid & Package IPA + TIPA
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid
          app_path="$(find "$RUNNER_TEMP/SingularityTV.xcarchive/Products/Applications" -maxdepth 1 -type d -name "*.app" | head -n 1)"
          out="$RUNNER_TEMP/out/iOS"
          mkdir -p "$out" "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/tipa/Payload"

          ditto "$app_path" "$RUNNER_TEMP/ipa/Payload/SingularityTV.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$out/SingularityTV-iOS-1.1.6.ipa" Payload)

          ditto "$app_path" "$RUNNER_TEMP/tipa/Payload/SingularityTV.app"
          cat > "$RUNNER_TEMP/tipa/entitlements.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>SINGULARITY.com.singularity.tv</string>
            <key>get-task-allow</key>
            <false/>
          </dict>
          </plist>
          PLIST
          ldid -S"$RUNNER_TEMP/tipa/entitlements.plist" "$RUNNER_TEMP/tipa/Payload/SingularityTV.app"
          (cd "$RUNNER_TEMP/tipa" && zip -qry "$out/SingularityTV-iOS-1.1.6.tipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Release
          path: ${{ runner.temp }}/out/iOS

  android-mobile:
    name: Android Mobile (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate source root
        id: src
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "android" ]]; then
            echo "root=$PWD/android" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          zip_path="$(find . -maxdepth 2 -type f -name "*.zip" -not -path "./.git/*" | head -n 1)"
          extract_dir="$RUNNER_TEMP/src"
          rm -rf "$extract_dir" && mkdir -p "$extract_dir"
          unzip -q -o "$zip_path" -d "$extract_dir"
          andr="$(find "$extract_dir" -maxdepth 4 -type d -name "android" | head -n 1)"
          echo "root=$andr" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android Mobile Release
        working-directory: ${{ steps.src.outputs.root }}
        run: gradle :app-mobile:assembleRelease :app-mobile:bundleRelease --no-daemon

      - name: Stage Android Mobile Outputs
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.src.outputs.root }}"
          out="$RUNNER_TEMP/out/Android-Mobile"
          mkdir -p "$out/ARM64-v8a" "$out/armeabi-v7a"
          cp "$root"/app-mobile/build/outputs/apk/release/*arm64-v8a*.apk "$out/ARM64-v8a/SingularityTV-Mobile-1.1.6-arm64-v8a.apk"
          cp "$root"/app-mobile/build/outputs/apk/release/*armeabi-v7a*.apk "$out/armeabi-v7a/SingularityTV-Mobile-1.1.6-armeabi-v7a.apk"
          cp "$root"/app-mobile/build/outputs/bundle/release/*.aab "$out/SingularityTV-Mobile-1.1.6.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: Android-Mobile-Release
          path: ${{ runner.temp }}/out/Android-Mobile

  android-tv:
    name: Android TV (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate source root
        id: src
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "android" ]]; then
            echo "root=$PWD/android" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          zip_path="$(find . -maxdepth 2 -type f -name "*.zip" -not -path "./.git/*" | head -n 1)"
          extract_dir="$RUNNER_TEMP/src"
          rm -rf "$extract_dir" && mkdir -p "$extract_dir"
          unzip -q -o "$zip_path" -d "$extract_dir"
          andr="$(find "$extract_dir" -maxdepth 4 -type d -name "android" | head -n 1)"
          echo "root=$andr" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android TV Release
        working-directory: ${{ steps.src.outputs.root }}
        run: gradle :app-tv:assembleRelease :app-tv:bundleRelease --no-daemon

      - name: Stage Android TV Outputs
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.src.outputs.root }}"
          out="$RUNNER_TEMP/out/Android-TV"
          mkdir -p "$out/ARM64-v8a" "$out/armeabi-v7a"
          cp "$root"/app-tv/build/outputs/apk/release/*arm64-v8a*.apk "$out/ARM64-v8a/SingularityTV-TV-1.1.6-arm64-v8a.apk"
          cp "$root"/app-tv/build/outputs/apk/release/*armeabi-v7a*.apk "$out/armeabi-v7a/SingularityTV-TV-1.1.6-armeabi-v7a.apk"
          cp "$root"/app-tv/build/outputs/bundle/release/*.aab "$out/SingularityTV-TV-1.1.6.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: Android-TV-Release
          path: ${{ runner.temp }}/out/Android-TV

  windows-x64:
    name: Windows Desktop x64 (EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate source root
        id: src
        shell: pwsh
        run: |
          if (Test-Path "windows") {
            "root=$PWD\windows" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $zip = Get-ChildItem -Path . -Filter *.zip -File | Select-Object -First 1
          $ext = "$env:RUNNER_TEMP\src"
          Expand-Archive -Path $zip.FullName -DestinationPath $ext -Force
          $win = Get-ChildItem -Path $ext -Directory -Filter "windows" -Recurse | Select-Object -First 1
          "root=$($win.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish & Build x64 Installer
        shell: pwsh
        run: |
          $winRoot = "${{ steps.src.outputs.root }}"
          dotnet publish "$winRoot\SingularityTV.Desktop\SingularityTV.Desktop.csproj" -c Release -r win-x64 -p:Platform=x64 --self-contained true
          iscc /DARCH=x64 "$winRoot\installer\SingularityTV.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-Release
          path: ${{ steps.src.outputs.root }}\installer\output\SingularityTV-Desktop-1.1.6-Windows-x64.exe

  windows-arm64:
    name: Windows Desktop ARM64 (EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate source root
        id: src
        shell: pwsh
        run: |
          if (Test-Path "windows") {
            "root=$PWD\windows" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $zip = Get-ChildItem -Path . -Filter *.zip -File | Select-Object -First 1
          $ext = "$env:RUNNER_TEMP\src"
          Expand-Archive -Path $zip.FullName -DestinationPath $ext -Force
          $win = Get-ChildItem -Path $ext -Directory -Filter "windows" -Recurse | Select-Object -First 1
          "root=$($win.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish & Build ARM64 Installer
        shell: pwsh
        run: |
          $winRoot = "${{ steps.src.outputs.root }}"
          dotnet publish "$winRoot\SingularityTV.Desktop\SingularityTV.Desktop.csproj" -c Release -r win-arm64 -p:Platform=ARM64 --self-contained true
          iscc /DARCH=ARM64 "$winRoot\installer\SingularityTV.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-ARM64-Release
          path: ${{ steps.src.outputs.root }}\installer\output\SingularityTV-Desktop-1.1.6-Windows-ARM64.exe

  bundle-release:
    name: Package SingularityTV-1.1.6 Combined Artifact
    needs: [ios, android-mobile, android-tv, windows-x64, windows-arm64]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: SingularityTV-1.1.6

      - uses: actions/upload-artifact@v4
        with:
          name: SingularityTV-1.1.6-All-Platforms
          path: SingularityTV-1.1.6
