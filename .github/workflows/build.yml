name: Build APK & IPA

on:
  push:
    branches: [ main, master, SingularityTV ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-large
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Project Archive
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" -type f | sort -V | tail -n 1)
          if [ -n "$ZIP_FILE" ]; then
            APP_BASE=$(basename "$ZIP_FILE" .zip)
            unzip -q -o "$ZIP_FILE" -d _unpacked
            if [ -d _unpacked/SingularityTV ]; then
              cp -R _unpacked/SingularityTV/. .
            else
              cp -R _unpacked/. .
            fi
            rm -rf _unpacked
          else
            APP_BASE="SingularityTV"
          fi
          echo "APP_BASE=$APP_BASE" >> "$GITHUB_ENV"
          echo "Building IPA as: ${APP_BASE}.ipa"
      - name: Compile React UI Assets
        run: |
          if [ -f scripts/build-android-assets.js ]; then
            if [ ! -d /usr/share/nodejs/@babel/core ] && [ ! -d node_modules/@babel/core ]; then
              npm install --no-save @babel/core @babel/preset-react @babel/plugin-transform-modules-commonjs babel-plugin-dynamic-import-node
            fi
            node scripts/build-android-assets.js
          fi
      - name: Sync WebAssets to iOS
        run: |
          if [ ! -d dist ] && [ -f scripts/build-android-assets.js ]; then
            node scripts/build-android-assets.js
          fi
          if [ ! -d dist ] && [ -d android/app/src/main/assets/public ]; then
            mkdir -p dist
            cp -R android/app/src/main/assets/public/* dist/
          fi
          mkdir -p ios/SingularityTV/WebAssets
          if [ -d dist ] && [ "$(ls -A dist)" ]; then
            cp -R dist/* ios/SingularityTV/WebAssets/
          fi
      - name: Generate Xcode Project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd ios
          xcodegen generate
      - name: Build Unsigned iOS App
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ios/SingularityTV.xcodeproj \
            -scheme SingularityTV \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee build/xcodebuild.log || (echo "=== SWIFT/XCODE ERRORS ===" && grep -n "error:" build/xcodebuild.log | head -n 30 && exit 1)
      - name: Package Ad-Hoc Signed IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/SingularityTV.app build/Payload/
          mkdir -p build/Payload/SingularityTV.app/WebAssets
          cp -R dist/* build/Payload/SingularityTV.app/WebAssets/
          cp -R dist/* build/Payload/SingularityTV.app/
          cp ios/SingularityTV/AppIcon*.png build/Payload/SingularityTV.app/ 2>/dev/null || true
          test -s build/Payload/SingularityTV.app/WebAssets/standalone.html
          test -s build/Payload/SingularityTV.app/WebAssets/bundle.js
          codesign --force --deep --sign - --timestamp=none build/Payload/SingularityTV.app
          cd build
          zip -r -y -q "${APP_BASE}.ipa" Payload
          ls -lh "${APP_BASE}.ipa"
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_BASE }}-iOS-IPA
          path: build/${{ env.APP_BASE }}.ipa
          retention-days: 30

      - name: Clean Old IPAs from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_ASSETS=$(gh release view latest --json assets --jq '.assets[].name' 2>/dev/null | grep -E '\.ipa$' || true)
          for asset in $OLD_ASSETS; do
            if [ "$asset" != "${APP_BASE}.ipa" ]; then
              gh release delete-asset latest "$asset" --yes || true
            fi
          done
      - name: Publish IPA to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SingularityTV Latest Build (IPA + APK)
          files: build/${{ env.APP_BASE }}.ipa
          prerelease: false

  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Project Archive
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" -type f | sort -V | tail -n 1)
          if [ -n "$ZIP_FILE" ]; then
            APP_BASE=$(basename "$ZIP_FILE" .zip)
            unzip -q -o "$ZIP_FILE" -d _unpacked
            if [ -d _unpacked/SingularityTV ]; then
              cp -R _unpacked/SingularityTV/. .
            else
              cp -R _unpacked/. .
            fi
            rm -rf _unpacked
          else
            APP_BASE="SingularityTV"
          fi
          echo "APP_BASE=$APP_BASE" >> "$GITHUB_ENV"
          echo "Building APK as: ${APP_BASE}.apk"
      - name: Compile React UI Assets
        run: |
          if [ -f scripts/build-android-assets.js ]; then
            if [ ! -d /usr/share/nodejs/@babel/core ] && [ ! -d node_modules/@babel/core ]; then
              npm install --no-save @babel/core @babel/preset-react @babel/plugin-transform-modules-commonjs babel-plugin-dynamic-import-node
            fi
            node scripts/build-android-assets.js
          fi
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Universal Release APK
        working-directory: android
        run: |
          set -o pipefail
          mkdir -p ../build
          gradle assembleUniversalRelease --no-daemon --console=plain 2>&1 | tee ../build/gradle.log || (echo '=== KOTLIN/GRADLE ERRORS ===' && (grep -n -E 'e: |error:|Unresolved|Type mismatch' ../build/gradle.log | head -n 40 || tail -n 50 ../build/gradle.log) && exit 1)
      - name: Collect APK
        run: |
          mkdir -p build
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_FILE" "build/${APP_BASE}.apk"
          ls -lh "build/${APP_BASE}.apk"
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_BASE }}-Android-APK
          path: build/${{ env.APP_BASE }}.apk
          retention-days: 30

      - name: Clean Old APKs from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_ASSETS=$(gh release view latest --json assets --jq '.assets[].name' 2>/dev/null | grep -E '\.apk$' || true)
          for asset in $OLD_ASSETS; do
            if [ "$asset" != "${APP_BASE}.apk" ]; then
              gh release delete-asset latest "$asset" --yes || true
            fi
          done
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SingularityTV Latest Build (IPA + APK)
          files: build/${{ env.APP_BASE }}.apk
          prerelease: false

  publish-ota:
    runs-on: ubuntu-latest
    needs: [ build-apk, build-ipa ]
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Project Archive
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" -type f | sort -V | tail -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q -o "$ZIP_FILE" -d _unpacked
            if [ -d _unpacked/SingularityTV ]; then
              cp -R _unpacked/SingularityTV/. .
            else
              cp -R _unpacked/. .
            fi
            rm -rf _unpacked
          fi
          if [ ! -d dist ] && [ -f scripts/build-android-assets.js ]; then
            node scripts/build-android-assets.js
          fi
          if [ ! -d dist ] && [ -d android/app/src/main/assets/public ]; then
            mkdir -p dist
            cp -R android/app/src/main/assets/public/* dist/
          fi
      - name: Detect Changed OTA Files
        run: |
          mkdir -p ota_stage prev_ota
          gh release download latest -p "ota-hashes.json" -D prev_ota 2>/dev/null || true
          python3 - << 'PY'
          import hashlib, json, os, shutil
          prev = {}
          prev_path = "prev_ota/ota-hashes.json"
          if os.path.exists(prev_path):
              try:
                  with open(prev_path, "r", encoding="utf-8") as f:
                      prev = json.load(f)
              except Exception:
                  prev = {}
          ota_candidates = ["bundle.js", "global.css"]
          curr = {}
          changed = []
          for name in ota_candidates:
              src = os.path.join("dist", name)
              if not os.path.exists(src):
                  continue
              with open(src, "rb") as f:
                  h = hashlib.sha256(f.read()).hexdigest()
              curr[name] = h
              if prev.get(name) != h:
                  changed.append(name)
                  shutil.copy2(src, os.path.join("ota_stage", name))
          with open("ota_stage/ota-hashes.json", "w", encoding="utf-8") as f:
              json.dump(curr, f, indent=2)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as envf:
              envf.write(f"OTA_CHANGED_COUNT={len(changed)}\n")
              envf.write(f"OTA_CHANGED_LIST={','.join(changed)}\n")
          print("Changed OTA files:", changed if changed else "None")
          PY
      - name: Clean Old OTA Files from Release
        if: env.OTA_CHANGED_COUNT != '0'
        run: |
          for asset in bundle.js global.css ota-hashes.json; do
            gh release delete-asset latest "$asset" --yes 2>/dev/null || true
          done
      - name: Publish Changed OTA Files to Release
        if: env.OTA_CHANGED_COUNT != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SingularityTV Latest Build (IPA + APK)
          files: ota_stage/*
          prerelease: false
