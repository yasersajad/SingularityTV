name: Build SingularityTV Android TV (1.1.6)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android-tv:
    name: Build Android TV APK & AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build TV Release APKs (arm64-v8a & armeabi-v7a) and AAB
        working-directory: android
        run: |
          gradle :app-tv:assembleRelease :app-tv:bundleRelease --no-daemon

      - name: Organize Android TV Release Outputs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dist/Android-TV"
          mkdir -p "$out/ARM64-v8a" "$out/armeabi-v7a"
          cp android/app-tv/build/outputs/apk/release/*arm64-v8a*.apk "$out/ARM64-v8a/SingularityTV-TV-1.1.6-arm64-v8a.apk"
          cp android/app-tv/build/outputs/apk/release/*armeabi-v7a*.apk "$out/armeabi-v7a/SingularityTV-TV-1.1.6-armeabi-v7a.apk"
          cp android/app-tv/build/outputs/bundle/release/*.aab "$out/SingularityTV-TV-1.1.6.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: SingularityTV-Android-TV-1.1.6
          path: ${{ runner.temp }}/dist/Android-TV
          if-no-files-found: error
