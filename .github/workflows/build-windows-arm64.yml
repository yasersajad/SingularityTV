name: Build SingularityTV Windows ARM64 (1.1.6)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows-arm64:
    name: Build Windows Desktop ARM64 Installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Self-Contained WinUI 3 (win-arm64)
        working-directory: windows/SingularityTV.Desktop
        run: |
          dotnet publish -c Release -r win-arm64 -p:Platform=ARM64 --self-contained true

      - name: Build Inno Setup Installer (ARM64)
        shell: cmd
        run: |
          iscc /DARCH=ARM64 windows\installer\SingularityTV.iss

      - uses: actions/upload-artifact@v4
        with:
          name: SingularityTV-Windows-ARM64-1.1.6
          path: windows/installer/output/SingularityTV-Desktop-1.1.6-Windows-ARM64.exe
          if-no-files-found: error
